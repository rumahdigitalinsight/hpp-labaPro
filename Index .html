ort:"Setiap pembelian makanan, tawarkan minuman 5k. Script: 'Mau sekalian Es Teh Jumbo cuma tambah 5rb?'. 45% akan yes.",detail:"HPP Es Teh 1.8k, jual 5k = margin 64%. Training kasir: jangan tanya 'minumnya apa?', tapi 'Es Teh atau Lemon Tea?'. Pilihan tertutup. Target 40% attach rate."},{n:7,title:"Paket Keluarga 4 Orang",badge:"+28%",short:"Paket 4 porsi + 4 minum + 2 snack = 129k. Keluarga lihat hemat, kamu jual 4x sekaligus, HPP efisien.",detail:"Hitung porsi keluarga agar HPP per orang turun 10% karena masak bulk. Contoh: masak 4 ayam sekaligus lebih irit gas & waktu. Packaging pakai dus besar, bukan 4 mika. Margin tetap 35% tapi volume naik."},{n:8,title:"Menu Rahasia / Secret Menu",badge:"+20%",short:"'Tanya menu rahasia ke kasir'. Eksklusivitas bikin pelanggan merasa insider, mau share di IG Story.",detail:"Buat 2 menu yang tidak ada di banner, hanya di highlight IG. Contoh: 'Ayam Geprek Level Neraka' atau 'Kopi Susu Kocok 2x'. Pelanggan harus DM atau tanya kasir. Viral organik, markup 15% karena rasa eksklusif."},{n:9,title:"Happy Hour 14:00-16:00",badge:"+14%",short:"Jam sepi kasih diskon 15% atau topping gratis. Isi slot kosong, putar stok, tetap margin karena jam sepi fixed cost sama.",detail:"Analisa jam sepi dari data GoFood. Biasanya 14-16 kosong. Pasang promo khusus: beli 1 topping gratis. Biaya topping 1k, tapi dapat transaksi yang kalau tidak ada = 0. Naikkan utilisasi dapur."},{n:10,title:"Loyalty Point Digital",badge:"+35%",short:"Beli 10 gratis 1. Pakai kartu stempel digital via WA. Retensi naik 35%, CAC turun karena pelanggan balik sendiri.",detail:"Buat format: 'Kak, simpan no ini, tiap beli ketik #Poin [Nama]'. Catat di sheet. Setelah 10, gratis 1 menu HPP terendah. HPP free item anggap biaya marketing 8k, lebih murah dari iklan 25k per pelanggan baru."},{n:11,title:"Cross-sell Snack 8K",badge:"+16%",short:"Snack add-on di bawah 10k di dekat kasir: cireng, tahu walik. Impulse buy, margin 60%+, tidak butuh mikir.",detail:"Taruh display snack goreng hangat dekat kasir. Pelanggan nunggu makanan, lapar mata. Harga 8k terasa kecil setelah bayar 35k. Target 1 dari 3 transaksi tambah snack. HPP 3k, untung 5k extra."},{n:12,title:"Ukuran Jumbo +8K",badge:"+24%",short:"Default reguler, opsi jumbo tambah 8k dapat nasi +50% & ayam lebih besar 30%. Pelanggan lihat value, kamu untung volume.",detail:"HPP tambahan jumbo cuma 3.5k (nasi 1k + ayam 2.5k), jual 8k = margin 56%. 30% pelanggan akan pilih jumbo kalau default-nya reguler. Tulis 'Paling Laris: Jumbo'."},{n:13,title:"Topping Premium 5-12K",badge:"+40%",short:"Keju mozarella, telur mata sapi, sambal extra, mozarella. Topping HPP 1-3k, jual 5-12k, margin tertinggi di bisnis kuliner.",detail:"List topping dengan foto. Contoh: Telur HPP 2k jual 6k, Keju Mozza HPP 3k jual 10k, Sambal Matah HPP 1k jual 5k. Rata-rata attach 25%. Ini mesin margin."},{n:14,title:"Combo Hemat Pelajar",badge:"+19%",short:"Nasi + Ayam + Es Teh = 18.9k khusus pelajar. Volume tinggi jam 11-13, HPP press 10.5k, tetap margin 44%.",detail:"Target dekat sekolah/kampus. Buat jam 11-13 saja. Pakai ayam ukuran 80g (lebih kecil) dan nasi 150g. Anak kos cari murah kenyang. Marketing: poster di kos & WA grup kampus. Volume > margin."},{n:15,title:"Langganan Mingguan Kantor",badge:"+32%",short:"Paket 5 hari lunch kantor: 125k/minggu (25k/hari). Dapat 20 pelanggan tetap = 2.5jt/minggu pasti.",detail:"Tawarkan ke kantor sekitar. Menu ganti harian, tidak perlu mikir. Bayar di awal minggu. Kamu dapat cashflow, produksi terencana, HPP bulk turun 12%. Bonus: gratis delivery."},{n:16,title:"Flash Sale 1 Jam",badge:"+50%",short:"Stok sisa 10 porsi jam 8 malam, flash sale 35% di story WA. Habis modal, tidak jadi waste, tetap dapat data pelanggan.",detail:"Jam 20:00 cek sisa. Foto real 'Sisa 10!'. Jual modal + 10% saja, yang penting tidak buang. Contoh HPP 10k jual 15k (biasa 30k). Daripada dibuang, dapat 5k & pelanggan baru."},{n:17,title:"Buy 2 Get 1 Snack",badge:"+21%",short:"Beli 2 menu utama gratis 1 snack 8k. Pelanggan beli 2 (naik AOV), snack HPP 3k anggap diskon 6%.",detail:"Hitung: AOV normal 32k, dengan promo jadi 64k. Diskon snack 8k = diskon efektif 12.5% saja, tapi psikologis 'Gratis'. Syarat: snack pilih acak, bukan request. Putar stok."},{n:18,title:"Harga Coret / Strikethrough",badge:"+17%",short:"Tulis harga asli dicoret: Rp45.000 Rp32.000. Anchoring effect: pelanggan merasa dapat diskon 29%, padahal harga target memang 32k.",detail:"Harga coret harus masuk akal, jangan bohong. Caranya: harga asli adalah harga tanpa promo + topping. Harga promo adalah paket hemat. Jadi jujur: 'Jika beli satuan 45k, paket 32k'. Legal & efektif."},{n:19,title:"Harga Grosir >10 Porsi",badge:"+26%",short:"Beli >10 porsi diskon 10% + free delivery. Target acara, arisan, pengajian. Satu transaksi = 10x normal.",detail:"HPP grosir turun karena masak besar. Contoh masak 20 ayam sekaligus hemat gas 30%. Packaging dus. Margin tetap 30% meski diskon 10%. Dapat market B2B."},{n:20,title:"Paket Diet 3 Hari",badge:"+38%",short:"Paket diet 600 kalori x 3 hari = 149k. Premium pricing, bahan sehat HPP 12k/hari, jual 49k/hari = margin 75%.",detail:"Kerjasama dengan influencer diet lokal. Menu: dada ayam, sayur rebus, nasi merah. Foto before-after. Pangsa diet mau bayar mahal asal jelas kalori. Buat label kalori."},{n:21,title:"Menu Musiman Ramadan",badge:"+45%",short:"Takjil, kolak, es buah selama Ramadan harga 20% lebih tinggi. Demand naik 3x, orang tidak sensitif harga.",detail:"2 minggu sebelum Ramadan, siapin 5 menu takjil. HPP rendah (kolak 4k) jual 12k. Orang bukber cari takjil, tidak bandingkan harga. Stok bahan dari sekarang."},{n:22,title:"Harga Pelajar Kos",badge:"+13%",short:"Kost-an area: nasi 10k kenyang. Porsi nasi 200g + telur + mie. HPP 5.5k, jual 10k, margin 45% tapi volume 100 porsi/hari.",detail:"Buka cabang virtual 'Warung 10K' di GoFood. Target mahasiswa. Masak nasi banyak, telur dadar bulk. Rata-rata mahasiswa pesan 2x seminggu. Jadi langganan."},{n:23,title:"Paket Nasi Kotak Event",badge:"+30%",short:"Nasi kotak 25k-35k untuk event. Harga bahan HPP 12-15k, margin 40-50%. Satu event 50 kotak = 1.25jt.",detail:"Buat 3 tier: Hemat 25k, Standard 32k, Premium 40k. Foto kotak rapi. Hubungi EO & masjid. Margin tinggi karena nasi kotak dianggap catering, bukan warung. Bisa pre-order."},{n:24,title:"Harga Katering Harian",badge:"+34%",short:"Katering harian kantor 30k/hari x 20 hari = 600k/bulan/pelanggan. Dapatkan 10 pelanggan = 6jt recurring.",detail:"Model subscription, bayar bulanan. Menu berbeda tiap hari, free delivery jam 12. Kamu dapat kepastian produksi. HPP turun 15% karena belanja mingguan. Ini pondasi bisnis."},{n:25,title:"Menu Viral TikTok",badge:"+55%",short:"Bikin 1 menu khusus untuk TikTok: warna unik, cheese pull, level pedas. Biaya bahan naik 1k, tapi views bisa 500k = free ads.",detail:"Riset TikTok: 'makanan pedas lumer' lagi viral. Buat versi kamu. Wajib video proses: tuang keju, sambal tumpah. Pakai hashtag #kuliner #mukbang. Satu video viral = 200 pesanan."},{n:26,title:"Harga Langganan Kopi",badge:"+42%",short:"Kopi langganan 20 cup/bulan 180k (9k/cup). Normal 15k, langganan hemat 40% bagi pelanggan, kamu dapat cash di depan.",detail:"Target pekerja WFO. Bayar 180k dapat 20 cap di kartu digital. HPP kopi 4.5k, jadi per cup untung 4.5k x 20 = 90k. Tapi uang di depan, retensi 90%. Buat grup WA langganan."},{n:27,title:"Strategi Loss Leader",badge:"+20%",short:"Jual 1 produk rugi / modal sebagai pemancing: Es Teh Jumbo 2k. Orang datang untuk es teh, pulang bawa ayam 32k.",detail:"Pilih produk HPP terendah (es teh 1.8k) jual 2k (rugi tipis setelah packaging). Pasang banner besar 'Es Teh Jumbo 2rb!!'. Pelanggan datang, 80% akan beli makanan utama. Rugi 0.5k untuk dapat transaksi 30k = CAC murah."}];function Ee(e){if(!e)return"";let n=e.replace(/[^\d]/g,"");if(!n)return"";return n.replace(/^0+(?=\d)/,"")}function Ev(e){let n=e.replace(",",".").trim(),t=parseFloat(n);if(isNaN(t))return{parsed:0,display:"0"};return{pars
